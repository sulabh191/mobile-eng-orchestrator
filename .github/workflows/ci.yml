name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        # The suite is fully offline: mock engine, mock tracker, local git.
        env:
          ORC_ENGINE: mock
        run: python -m pytest --cov=orchestrator --cov-report=term-missing

  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    # Advisory until the first green run: ruff and mypy have not yet been executed
    # against this codebase. Once their findings are fixed, delete this line so the
    # job blocks merges like the tests do.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy
