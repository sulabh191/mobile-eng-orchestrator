[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mobile-eng-orchestrator"
version = "0.1.0"
description = "Cross-platform AI engineering orchestration framework for iOS, Android and beyond."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Engineering Orchestrator contributors" }]
keywords = ["ai", "agents", "orchestration", "ios", "android", "jira", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
keyring = ["keyring>=25.0"]
sdk = ["claude-agent-sdk>=0.1.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
orc = "orchestrator.cli.app:main"
mobile-eng-orchestrator = "orchestrator.cli.app:main"

[project.urls]
Homepage = "https://github.com/sulabh191/mobile-eng-orchestrator"
Documentation = "https://github.com/sulabh191/mobile-eng-orchestrator/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
artifacts = ["src/orchestrator/py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: exercises real external services (skipped by default)",
]

[tool.ruff]
# 110 rather than 88/100: Typer option declarations and long help strings do not
# wrap into anything more readable, and this keeps the limit meaningful instead
# of silenced.
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
  # Typer reads defaults from the signature, so `x: T = typer.Option(...)` is the
  # documented usage, not a mutable-default bug.
  "B008",
  # Click/Typer resolve `Optional[T]` reliably across versions; the PEP 604 form
  # is not equivalent for them, so the CLI keeps Optional deliberately.
  "UP007",
  "UP045",
]

[tool.mypy]
python_version = "3.11"
packages = ["orchestrator"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
